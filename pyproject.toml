[project]
name = "mathfirst"
version = "0.1.0"
description = "A math-native layer for representing and working with mathematics in Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = []

[project.urls]
Repository = "https://github.com/jakeryderv/mathfirst"
Issues = "https://github.com/jakeryderv/mathfirst/issues"

[project.scripts]
mathfirst = "mathfirst:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
